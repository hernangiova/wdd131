<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Rodrigo Hernandez">
    <meta name="description" content="This page will learn how to use forms and all the topics until now in the course.">
    <title>Product Review</title>
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <label for="product">Product Name</label>
            <select id="product" name="product" required>
                <option value="" selected disabled>Select a Product</option>
            </select>

            <label>Overall Rating</label>

            <div class="rating">
                <label for="star1">☆</label>
                <input type="radio" id="star1" name="rating" value="1" required>

                <label for="star2">☆☆</label>
                <input type="radio" id="star2" name="rating" value="2" required>

                <label for="star3">☆☆☆</label>
                <input type="radio" id="star3" name="rating" value="3" required>

                <label for="star4">☆☆☆☆</label>
                <input type="radio" id="star4" name="rating" value="4" required>

                <label for="star5">☆☆☆☆☆</label>
                <input type="radio" id="star5" name="rating" value="5" required>
            </div>

            <label for="installDate">Date of Installation</label>
            <input type="date" id="installDate" name="installDate" required>

            <p>Useful Features</p>

            <div class="features">

                <label for="durability">
                    <input type="checkbox" id="durability" name="features" value="Durability">
                    Durability
                </label>

                <label for="ease">
                    <input type="checkbox" id="ease" name="features" value="Ease of Use">
                    Easy of Use
                </label>
                
                <label for="performance">
                    <input type="checkbox" id="performance" name="features" value="Performance"> 
                    Performance
                </label>    

                <label for="Design">
                    <input type="checkbox" id="design" name="features" value="Design"> 
                    Design
                </label>

            </div>

            <label for="review">Written Review</label>
            <textarea id="review" name="review"></textarea>

            <label for="username">Your Name</label>
            <input type="text" id="username" name="username">

            <input type="submit" value="Post Review">

        </form>
    </main>

    <footer>
        <p>©️<span id="currentyear"></span>| Rodrigo Hernandez | Guatemala</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
